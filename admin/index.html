<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emiliana Parati — Admin</title>
  <link href="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.css" rel="stylesheet" />
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Автоматический перехват для входа через токен на GitHub Pages
    if (!window.location.hash && !localStorage.getItem('decap-cms-user')) {
      const token = prompt('Вставьте ваш Personal Access Token (ghp_...):');
      if (token) {
        const userData = {
          token: token.trim(),
          backendName: 'github'
        };
        localStorage.setItem('decap-cms-user', JSON.stringify(userData));
        window.location.reload();
      }
    }
  </script>
</body>
</html>
