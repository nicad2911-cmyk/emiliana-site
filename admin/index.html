<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emiliana Parati — Admin</title>
  <link href="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.css" rel="stylesheet" />
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Перехватываем стандартный логин Decap CMS и подставляем токен напрямую в localStorage
    (function() {
      const stored = localStorage.getItem('decap-cms-user');
      if (!stored) {
        const token = prompt("Введи твой Personal Access Token из GitHub (ghp_...):");
        if (token && token.trim().length > 0) {
          const user = {
            token: token.trim(),
            backendName: 'github'
          };
          localStorage.setItem('decap-cms-user', JSON.stringify(user));
        }
      }
    })();
  </script>
</body>
</html>
