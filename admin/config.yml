backend:
  name: github
  repo: nicad2911-cmyk/emiliana-site
  branch: main
  base_url: https://decap-cms-oauth-backend.vercel.app
  auth_endpoint: /auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "Sayt / Site"
    files:
      - name: "content"
        label: "Bütün Məzmun"
        file: "content/data.json"
        fields:
          - label: "Ümumi (Meta)"
            name: meta
            widget: object
            fields:
              - { label: Logo, name: logo, widget: image, required: false }
              - { label: Telefon, name: phone, widget: string }
              - { label: Email, name: email, widget: string }
              - { label: Ünvan, name: address, widget: string }
              - label: "İş saatları"
                name: hours
                widget: object
                fields: &lang3
                  - { label: AZ, name: az, widget: string }
                  - { label: EN, name: en, widget: string }
                  - { label: RU, name: ru, widget: string }

          - label: Hero
            name: hero
            widget: object
            fields:
              - label: "Şəkillər (4)"
                name: images
                widget: list
                field: { label: URL, name: url, widget: image }
              - { label: Eyebrow, name: eyebrow, widget: object, fields: *lang3 }
              - { label: Başlıq, name: headline, widget: object, fields: *lang3 }
              - { label: Alt-mətn, name: sub, widget: object, fields: *lang3 }

          - label: "Haqqımızda"
            name: about
            widget: object
            fields:
              - { label: Başlıq, name: headline, widget: object, fields: *lang3 }
              - { label: "Paraqraf 1", name: p1, widget: object, fields: *lang3 }
              - { label: "Paraqraf 2", name: p2, widget: object, fields: *lang3 }
              - { label: Sitat, name: quote, widget: object, fields: *lang3 }
              - label: Statistika
                name: stats
                widget: list
                fields:
                  - { label: Rəqəm, name: n, widget: string }
                  - { label: Etiket, name: label, widget: object, fields: *lang3 }

          - label: Məhsullar
            name: products
            widget: list
            fields:
              - { label: Açar, name: key, widget: select, options: [paint, wallpaper, doors, parquet] }
              - { label: Ad, name: name, widget: object, fields: *lang3 }
              - { label: Təsvir, name: desc, widget: object, fields: *lang3 }

          - label: "Niyə Biz"
            name: why
            widget: list
            fields:
              - { label: Başlıq, name: title, widget: object, fields: *lang3 }
              - { label: Təsvir, name: desc, widget: object, fields: *lang3 }

          - label: Brendlər
            name: brands
            widget: list
            fields:
              - { label: Ad, name: name, widget: string }
              - { label: Kateqoriya, name: category, widget: select, options: [paint, wallpaper, doors, parquet] }

          - label: Qalereya
            name: gallery
            widget: list
            fields:
              - { label: Şəkil, name: image, widget: image, required: false }
              - { label: Otaq, name: room, widget: select, options: [living, bedroom, entrance, office] }
              - { label: Alt yazı, name: caption, widget: object, fields: *lang3 }

          - label: Rəylər
            name: reviews
            widget: list
            fields:
              - { label: Mətn, name: text, widget: object, fields: *lang3 }
              - { label: Müəllif, name: author, widget: object, fields: *lang3 }

          - label: Footer
            name: footer
            widget: object
            fields:
              - { label: Şüar, name: tagline, widget: object, fields: *lang3 }
